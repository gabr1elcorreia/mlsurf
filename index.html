<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&L Surf</title>

<link rel="icon" type="image/png" href="https://i.imgur.com/ty1WtiZ.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#e8e8e8;
overflow:hidden;

background:linear-gradient(-45deg,#0f0f0f,#1a1a1a,#222,#111);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:100%;
max-width:420px;
background:rgba(20,20,20,0.75);
backdrop-filter:blur(12px);
border-radius:28px;
padding:40px 28px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

.logo{
width:160px;
margin-bottom:20px;
animation:logoFloat 3s ease-in-out infinite;
transition:transform .35s ease;
}

.logo:hover{
transform:scale(1.05) rotate(-2deg);
}

@keyframes logoFloat{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

h1{
font-size:2rem;
margin-bottom:10px;
color:#ffffff;
}

.subtitle{
font-size:0.95rem;
line-height:1.6;
color:#bdbdbd;
margin-bottom:25px;
}

.highlight{
background:#1f1f1f;
padding:12px 18px;
border-radius:18px;
font-size:0.9rem;
margin-bottom:28px;
border:1px solid rgba(255,255,255,0.08);
color:#d0d0d0;
}

.buttons{
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
text-decoration:none;
padding:14px;
border-radius:14px;
font-weight:600;
transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
}

.btn-primary{
background:linear-gradient(135deg,#3a3a3a,#222);
color:white;
}

.btn-primary:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,0.5);
}

.btn-secondary{
background:#1a1a1a;
border:1px solid rgba(255,255,255,0.08);
color:#e0e0e0;
}

.btn-secondary:hover{
background:#2a2a2a;
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

.footer{
margin-top:20px;
font-size:0.8rem;
color:#777;
}

@media(max-width:480px){

.card{
padding:32px 22px;
}

.logo{
width:140px;
}

}

</style>
</head>

<body>

<div class="card">

<img src="https://i.imgur.com/ty1WtiZ.png" class="logo">

<h1>M&L Surf</h1>

<p class="subtitle">
Está procurando um kit maneiro? Aqui você encontra tudo o que precisa!
Receba no conforto da sua casa: enviamos para todo o Brasil e realizamos entregas em toda a Grande Vitória. 🚚📦
</p>

<div class="buttons">

<a class="btn btn-primary"
href="https://mlsurf.com.br"
target="_blank">
Compre online clicando aqui
</a>

<a class="btn btn-secondary"
href="https://instagram.com/mlsurf_vv"
target="_blank">
Instagram
</a>

<a class="btn btn-secondary"
href="https://api.whatsapp.com/send?phone=5527995821259&text=Ol%C3%A1%2C%20vim%20atrav%C3%A9s%20do%20site!"
target="_blank">
WhatsApp
</a>

</div>

</div>

</body>
</html>
