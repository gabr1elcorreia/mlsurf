<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&L Surf</title>

<link rel="icon" type="image/png" href="https://i.imgur.com/ty1WtiZ.png">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#e8e8e8;

background:linear-gradient(-45deg,#0f0f0f,#1a1a1a,#222,#111);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:100%;
max-width:420px;
background:rgba(20,20,20,0.75);
backdrop-filter:blur(14px);
border-radius:28px;
padding:40px 28px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 20px 60px rgba(0,0,0,0.7);
}

.logo{
width:160px;
margin-bottom:20px;
animation:logoFloat 3s ease-in-out infinite;
transition:transform .35s ease;
}

.logo:hover{
transform:scale(1.05) rotate(-2deg);
}

@keyframes logoFloat{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

h1{
font-size:2rem;
margin-bottom:10px;
color:#ffffff;
}

.subtitle{
font-size:0.95rem;
line-height:1.6;
color:#bdbdbd;
margin-bottom:25px;
}

.section-title{
margin:20px 0 10px;
font-size:0.75rem;
color:#777;
letter-spacing:1.5px;
text-transform:uppercase;
}

.buttons{
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
padding:14px;
border-radius:14px;
font-weight:600;
transition:all .25s ease;
opacity:0;
transform:translateY(10px);
animation:fadeUp .6s forwards;
}

.btn i{
font-size:1rem;
}

.btn:nth-child(1){animation-delay:.1s;}
.btn:nth-child(3){animation-delay:.2s;}
.btn:nth-child(5){animation-delay:.3s;}
.btn:nth-child(7){animation-delay:.4s;}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

.btn-primary{
background:linear-gradient(135deg,#3a3a3a,#222);
color:white;
}

.btn-whatsapp{
background:linear-gradient(135deg,#25D366,#1ebe5d);
color:white;
box-shadow:0 0 0 rgba(37,211,102,0.4);
}

.btn-instagram{
background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
color:white;
}

.btn:hover{
transform:translateY(-4px) scale(1.02);
box-shadow:0 12px 30px rgba(0,0,0,0.6);
}

.btn-whatsapp:hover{
box-shadow:0 0 20px rgba(37,211,102,0.5);
}

/* DIVISOR */

.divider{
height:1px;
width:100%;
background:linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
margin:18px 0 10px;
}

/* mobile */

@media(max-width:480px){
.card{
padding:32px 22px;
}
.logo{
width:140px;
}
}

</style>
</head>

<body>

<div class="card">

<img src="https://i.imgur.com/ty1WtiZ.png" class="logo">

<h1>M&L Surf</h1>

<p class="subtitle">
Receba no conforto da sua casa. Realizamos entregas em toda a grande Vitória e enviamos para todo o Brasil. 🚚📦
</p>

<div class="buttons">

<div class="section-title">Vila Velha</div>

<a class="btn btn-whatsapp"
href="https://api.whatsapp.com/send?phone=5527995821259&text=Ol%C3%A1%2C%20vim%20atrav%C3%A9s%20do%20site!"
target="_blank">
<i class="fab fa-whatsapp"></i>
Compre pelo WhatsApp (Vila Velha)
</a>

<div class="section-title">Vitória</div>

<a class="btn btn-whatsapp"
href="https://api.whatsapp.com/send?phone=5527997064244&text=Ol%C3%A1%2C%20vim%20atrav%C3%A9s%20do%20site!"
target="_blank">
<i class="fab fa-whatsapp"></i>
Compre pelo WhatsApp (Vitória)
</a>

<!-- SEPARAÇÃO AQUI -->
<div class="divider"></div>

<a class="btn btn-primary"
href="https://mlsurf.store"
target="_blank">
<i class="fas fa-globe"></i>
Compre online
</a>

<a class="btn btn-instagram"
href="https://www.instagram.com/ml.surff"
target="_blank">
<i class="fab fa-instagram"></i>
@ml.surff
</a>

</div>

</div>

</body>
</html>
